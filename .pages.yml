# Pages CMS config, for the Purple Crate instance at cms.purplecrate.co.
#
# This is Pages CMS syntax (`type:`), NOT the Decap/Sveltia syntax (`widget:`) used by
# static/admin/config.yml. The two configs coexist deliberately — Sveltia stays until
# this one is verified against a real editing session, because it is also what provides
# zero-auth local editing (`/admin` -> "Work with Local Repository"), which Pages CMS
# has no equivalent for.
#
# Content model reference: docs/cms.md.

# Two media roots, and they are not interchangeable.
#
#  project_media — served at a real, stable URL. Project `cover:` images double as
#    og:image (scrapers want a plain JPEG at a fixed URL, not an avif/webp srcset), and
#    body images are rendered from markdown by `marked`, which emits raw <img src> with
#    no chance to substitute a processed asset. Nothing here gets responsive variants,
#    so keep uploads <=2000px on the long edge — the browser downloads them at full size.
#
#  pictures — gallery photos, processed at build time by @11ty/eleventy-img into
#    hashed responsive variants. These are never served from their repo path, which is
#    why `output` mirrors `input` rather than being a public URL: the value only has to
#    survive the basename() in eleventy/_data/pictures.js, which strips directory and
#    extension both. jpg/jpeg/png/webp, any case — the port made the extension filter
#    case-insensitive, so the old lowercase-only rule is gone. RAW (.NEF) never reaches
#    the build.
media:
  - name: project_media
    label: Project media
    input: static/project-media
    output: /project-media
    categories: [image]
    extensions: [jpg, jpeg, png, webp]
  - name: pictures
    label: Gallery photos
    input: src/lib/content/pictures
    output: src/lib/content/pictures
    categories: [image]
    extensions: [jpg, jpeg, png, webp]

content:
  # ---------------------------------------------------------------- Site settings
  # Singleton: one form editing one JSON file, rather than a list of entries.
  # Every string here is rendered by a homepage section — see eleventy/_data/site.js.
  # Adding a field means touching the JSON, this file, and the section template that
  # renders it.
  - name: settings
    label: Site settings
    type: file
    path: src/lib/content/settings/homepage.json
    format: json
    fields:
      # Stores the project's slug. Project files are src/lib/content/projects/<slug>.md,
      # so `{name}` — the entry name, i.e. filename without extension — IS the slug.
      # Leave empty to feature the newest project by year; a slug pointing at a deleted
      # or renamed project falls back the same way, so the section can't go blank.
      - name: featured_project
        label: Featured project
        type: reference
        required: false
        options:
          collection: projects
          value: '{name}'
          label: '{fields.title} ({fields.year})'
          search: 'fields.title,fields.cat,fields.year'
        description: >-
          The homepage pulls this project's intro and the first four of its featured
          gallery pictures. Empty = use the most recent project.

      # The homepage, as an ordered list of sections. This is what the Preview field below
      # renders: the CMS fetches eleventy/_includes/blocks/<type>.html out of this repo and
      # runs it against the section being edited, so the preview is the site's own markup
      # and cannot drift from it.
      #
      # Two constraints come from that, and both are load-bearing:
      #   1. `name` here MUST match a partial at eleventy/_includes/blocks/<name>.html —
      #      the CMS hardcodes that .html extension, so a .njk partial reads as missing.
      #   2. Those partials may only read `sec.*` — see eleventy/_includes/blocks/README.md.
      #
      # These sections are reorderable and removable because a block list is what makes the
      # preview possible. They are NOT actually interchangeable: the hero carries the page's
      # <h1> and its own background, .t-gallery's tablet rules assume Selected Work follows
      # the hero, and the GSAP timeline targets sections by data-anim. Reordering is safe;
      # deleting the hero costs the page its heading.
      - name: blocks
        label: Homepage sections
        type: block
        blockKey: type
        list:
          collapsible:
            collapsed: true
            summary: '{fields.type}'
        blocks:
          # ── Hero ────────────────────────────────────────────────────────────
          - name: hero
            label: Hero
            fields:
              - { name: name_top, label: Name — first line, type: string }
              - { name: name_bottom, label: Name — second line, type: string }
              - name: blurb
                label: Blurb
                type: text
                description: Small mono paragraph in the hero. Hidden on phones.
              - { name: cta, label: Button label, type: string }
              - { name: scroll_hint, label: Scroll hint, type: string }

          # ── Selected Work ───────────────────────────────────────────────────
          # The photographs come from the Gallery collection (the first eight, in
          # gallery order), not from this section — only the copy is edited here.
          - name: selected-work
            label: 'Selected Work (gallery peek)'
            fields:
              - { name: kicker, label: Kicker, type: string }
              - name: heading
                label: Heading
                type: string
                description: Rendered before the italic gold words, e.g. "Frames that"
              - name: heading_accent
                label: Heading — accent
                type: string
                description: Set in italic gold, with the full stop added automatically.
              # A list, not a text field: the partial has to render this without a
              # filter, and Nunjucks cannot split a string (see blocks/README.md).
              - name: note
                label: Note
                type: string
                list: true
                description: Right-aligned mono note. One item per line.
              - { name: note_years, label: Note — years, type: string }

          # ── Featured project ────────────────────────────────────────────────
          - name: featured-project
            label: Featured project
            fields:
              - { name: kicker, label: Kicker, type: string }
              # Everything else in this section — title, intro, category, year and
              # the collage — comes from the project picked in Featured project
              # above, so there is nothing else to edit here.

          # ── About ───────────────────────────────────────────────────────────
          - name: about
            label: About
            fields:
              - { name: kicker, label: Kicker, type: string }
              - { name: heading, label: Heading, type: string }
              - { name: lead, label: Lead paragraph, type: text }
              - { name: body, label: Second paragraph, type: text }
              - name: stats
                label: Stats
                type: object
                list: true
                description: Three reads best; the row is a 3-column grid.
                fields:
                  - { name: num, label: Number, type: string }
                  - { name: label, label: Label, type: string }
              - name: services
                label: Service tags
                type: string
                list: true
                description: One tag per item.
              - { name: signature, label: Signature, type: string }

          # ── Contact ─────────────────────────────────────────────────────────
          - name: contact
            label: Contact
            fields:
              - { name: kicker, label: Kicker, type: string }
              - { name: heading, label: Heading, type: string }
              - name: heading_accent
                label: Heading — accent
                type: string
                description: Set in italic gold, with the full stop added automatically.
              - { name: blurb, label: Blurb, type: text }
              - name: email
                label: Email
                type: string
                description: Used for the big mailto link.
              - { name: follow_title, label: 'Links: title', type: string }
              - name: follow_links
                label: 'Links'
                type: object
                list: true
                fields:
                  - { name: label, label: Label, type: string }
                  - { name: url, label: URL, type: string }
              # studio_title / studio_lines / enquiries_title / phone are still in
              # the JSON but no template renders them. Left out of the form rather
              # than offering an editor fields that change nothing.

      # Live preview pane, rendered by the CMS's custom `preview` field
      # (fields/custom/preview in purplecrateco/purplecrate-cms). It POSTs the live
      # `blocks` value to the render endpoint, which renders the partials above straight
      # out of this repo. Nothing is written to the content file — the field has no value.
      #
      # baseHref and stylesheets need a DEPLOYED site: the preview iframe loads the real
      # stylesheet over the network. Until this site is hosted, uncommenting them buys
      # nothing and the pane renders unstyled. Set baseHref to the site root and leave the
      # sheet list as-is — one stylesheet is all this build emits.
      - name: _preview
        label: Preview
        type: preview
        options:
          # Form field whose value drives the preview.
          watch: blocks
          # Repo directory holding one partial per block type.
          templates: eleventy/_includes/blocks
          # Key on each block naming its type, and the Nunjucks variable the
          # partials read it from (see eleventy/index.njk).
          blockKey: type
          contextKey: sec
          # Resolves the root-relative URLs below — and the templates' own /IMG_7387.JPG,
          # /portrait.jpeg and gallery sources — against the deployed site. Without it they
          # resolve against the CMS origin, which has none of them, and the pane renders
          # unstyled with alt text where the photographs should be.
          #
          # Points at the workers.dev URL for now; swap it for the custom domain when there
          # is one. It must be a deployed build: the preview fetches the real stylesheet
          # over the network, so a section edited but not yet deployed previews against the
          # CSS and images of the last deploy.
          baseHref: https://mac-harness-photography.josephheinz28.workers.dev/
          stylesheets:
            # Copied verbatim from layouts/base.njk — same families and weights, or the
            # preview renders in faces the site never loads.
            - https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital@0;1&display=swap
            - /assets/app.css
      - name: footer_note
        label: Footer line
        type: string
        description: Shown in the footer on every page, not just the homepage.

  # ---------------------------------------------------------------- Gallery
  # One entry per photo, editing the paired sidecar files in src/lib/content/pictures/
  # (IMG_7250.jpg + IMG_7250.md).
  #
  # An image with no metadata entry still appears on the site, so nothing vanishes if a
  # file lands here outside the CMS.
  - name: pictures
    label: Gallery
    type: collection
    path: src/lib/content/pictures
    format: yaml-frontmatter
    exclude: [README.md]
    # `layout: grid` browses these as a wall of thumbnails instead of rows — the
    # Media section could already do that, but couldn't edit caption and order.
    # Tiles take their image from the first `type: image` field (`image` here);
    # set `view.thumbnail: <field>` to pick a different one. Custom to our Pages CMS
    # fork, see components/collection/README.md in purplecrateco/purplecrate-cms.
    #
    # `primary: image` means each tile is labelled with the photo's path, which is
    # ugly. Don't "fix" it by switching to `caption` without thinking, for two
    # reasons: all 61 captions are currently empty, and no `filename` is set here, so
    # the default template `{year}-{month}-{day}-{primary}.md` (lib/config.ts) feeds
    # `primary` into the filenames of NEW entries.
    #
    # That default is survivable either way: filename tokens are slugified with
    # `strict: true`, so a path value loses its slashes rather than creating
    # subdirectories — which matters because the glob in pictures.ts is not
    # recursive and would silently ignore a nested sidecar. New CMS-created entries
    # just get a long name; pairing keys off the `image` field, not the filename.
    view:
      layout: grid
      fields: [image, order, caption]
      primary: image
      sort: [order, image, caption]
      search: [image, caption]
      default:
        sort: order
        order: asc
    fields:
      - name: image
        label: Photo
        type: image
        options:
          media: pictures
        description: Lowercase .jpg/.jpeg/.png/.webp — RAW files are ignored by the build.
      - name: caption
        label: Caption
        type: string
        required: false
        description: Used as alt text. Falls back to the filename when empty.
      - name: order
        label: Order
        type: number
        required: false
        options:
          step: 1
        description: Lowest first. Entries with no order sort last, by filename.

  # ---------------------------------------------------------------- Projects
  - name: projects
    label: Projects
    type: collection
    path: src/lib/content/projects
    format: yaml-frontmatter
    view:
      fields: [title, year, cat]
      primary: title
      sort: [year, title]
      search: [title, cat, year]
      default:
        sort: year
        order: desc
    fields:
      - { name: title, label: Title, type: string }
      - name: cat
        label: Category
        type: string
        required: false
        description: 'Free text, e.g. "Automotive · Street"'
      - name: year
        label: Year
        type: string
        required: false
        description: Drives ordering — projects sort newest first.
      - name: cover
        label: Cover image
        type: image
        required: false
        options:
          media: project_media
        description: Shown on the projects table and as the page hero. Also the og:image.
      - { name: intro, label: Intro, type: text, required: false }

      # `value: '{name}'` is load-bearing. This must store the BARE picture name
      # (e.g. "IMG_7250"), because normalizePictureRef() in eleventy/_data/site.js
      # strips the extension but NOT a directory — so a path-prefixed value would
      # silently fail to resolve and the project would render with no pictures.
      # `{name}` is the sidecar's filename without extension, which is exactly the bare
      # name already in the committed frontmatter. Don't change this to {path}.
      - name: gallery
        label: Featured gallery pictures
        type: reference
        required: false
        options:
          collection: pictures
          multiple: true
          value: '{name}'
          label: '{fields.image} — {fields.caption}'
          search: 'fields.image,fields.caption'

      # Maps to the markdown body, not a frontmatter key, because `format` above is
      # yaml-frontmatter.
      - name: body
        label: Body
        type: rich-text
